name: OpenGL Test and Screenshot

on:
  push:
  pull_request:

jobs:
  opengl-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            mesa-utils \
            freeglut3-dev \
            xvfb \
            imagemagick \
            x11-utils \
            libwayland-dev \
            wayland-protocols \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev

      - name: Build OpenGL app
        run: |
          mkdir -p build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Run all OpenGL targets with Xvfb and capture screenshots
        run: |
          mkdir -p screenshots
          
          # Force software OpenGL (Mesa) for CI
          export LIBGL_ALWAYS_SOFTWARE=1

          # Start virtual X server
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99
          sleep 2

          # Recursively find and run all executables in build/src/Assignments
          find build/src/Assignments -type f -executable | while read exe; do
              name=$(basename "$exe")
              echo "Running $name..."
              
              # Run app in background
              "$exe" &
              pid=$!

              # Wait for it to render
              sleep 10

              # Capture screenshot
              xwd -root -silent -out "screenshots/${name}.xwd"
              convert "screenshots/${name}.xwd" "screenshots/${name}.png"
              rm "screenshots/${name}.xwd"

              # Stop the app
              kill $pid || true
          done

      - name: Upload screenshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opengl-screenshots
          path: screenshots/
