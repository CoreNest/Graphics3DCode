name: OpenGL Test and Screenshot

on:
  push:
  pull_request:

jobs:
  opengl-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          mesa-utils \
          freeglut3-dev \
          xvfb \
          imagemagick \
          libwayland-dev \
          wayland-protocols \
          wayland-scanner++ \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libxkbcommon-dev

      - name: Build OpenGL app
        run: |
          mkdir build && cd build
          cmake ..
          make -j$(nproc)

      - name: Run all OpenGL targets with Xvfb and capture screenshots
        run: |
          mkdir -p screenshots
      
          # Start virtual X server
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99
          sleep 2
      
          # Iterate over all executable files in build/
          for exe in $(find build -maxdepth 1 -type f -executable); do
              name=$(basename "$exe")
              echo "Running $name..."
              
              # Run the app in background
              "$exe" &
              pid=$!
              
              # Wait for it to render
              sleep 3
              
              # Capture screenshot
              import -window root "screenshots/${name}.png"
              
              # Stop the app
              kill $pid || true
          done


      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: opengl-screenshot
          path: screenshots/
